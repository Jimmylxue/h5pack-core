<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>h5pack Bridge 测试</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: #f5f7fa;
        color: #333;
        padding: 16px;
        padding-bottom: 80px;
      }

      h1 {
        text-align: center;
        font-size: 20px;
        font-weight: 600;
        color: #1a1a1a;
        margin-bottom: 20px;
      }

      h1 span {
        color: #4f8ef7;
      }

      .card {
        background: #fff;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      }

      .card-title {
        font-size: 15px;
        font-weight: 600;
        color: #1a1a1a;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .card-title .icon {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
      }

      .icon-camera { background: #e8f5e9; }
      .icon-location { background: #e3f2fd; }
      .icon-mic { background: #fce4ec; }

      .btn-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .btn {
        flex: 1;
        min-width: calc(50% - 4px);
        padding: 10px 12px;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.1s;
        color: #fff;
        text-align: center;
      }

      .btn:active {
        opacity: 0.8;
        transform: scale(0.97);
      }

      .btn-blue { background: #4f8ef7; }
      .btn-green { background: #34c759; }
      .btn-orange { background: #ff9500; }
      .btn-red { background: #ff3b30; }
      .btn-purple { background: #af52de; }
      .btn-teal { background: #5ac8fa; }
      .btn-gray { background: #8e8e93; }
      .btn-pink { background: #ff2d55; }

      .btn-full {
        flex: none;
        width: 100%;
      }

      .preview-area {
        margin-top: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      #cameraPreview {
        width: 100%;
        max-height: 200px;
        object-fit: contain;
        border-radius: 8px;
        background: #f0f0f0;
        display: none;
      }

      #cameraPreview[src]:not([src=""]) {
        display: block;
      }

      .result-box {
        margin-top: 10px;
        padding: 10px 12px;
        background: #f8f9fb;
        border-radius: 8px;
        font-size: 12px;
        color: #666;
        word-break: break-all;
        line-height: 1.6;
        min-height: 20px;
      }

      .result-box:empty {
        display: none;
      }

      .result-label {
        font-size: 12px;
        color: #999;
        margin-top: 8px;
        margin-bottom: 2px;
      }

      .result-label:first-child {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <h1>📦 <span>h5pack</span> Bridge 测试</h1>

    <!-- 相机模块 -->
    <div class="card">
      <div class="card-title">
        <span class="icon icon-camera">📷</span>
        相机模块
      </div>
      <div class="btn-group">
        <button class="btn btn-blue" onclick="checkCameraPermission()">查看权限</button>
        <button class="btn btn-green" onclick="requestCameraPermission()">申请权限</button>
        <button class="btn btn-orange" onclick="openCamera()">拍照</button>
        <button class="btn btn-purple" onclick="chooseImage()">相册</button>
        <button class="btn btn-teal btn-full" onclick="scan()">扫码</button>
      </div>
      <div class="preview-area">
        <img id="cameraPreview" alt="" />
        <div class="result-box" id="scanRes"></div>
      </div>
    </div>

    <!-- 位置模块 -->
    <div class="card">
      <div class="card-title">
        <span class="icon icon-location">📍</span>
        位置模块
      </div>
      <div class="btn-group">
        <button class="btn btn-blue" onclick="checkLocationPermission()">检查权限</button>
        <button class="btn btn-green" onclick="requestLocationPermission()">申请权限</button>
        <button class="btn btn-teal" onclick="checkLocationEnabled()">定位服务</button>
        <button class="btn btn-orange" onclick="getCurrentPosition()">获取位置</button>
        <button class="btn btn-gray" onclick="openLocationSettings()">定位设置</button>
        <button class="btn btn-gray" onclick="openAppSettings()">应用设置</button>
      </div>
      <div class="result-box" id="position"></div>
    </div>

    <!-- 录音模块 -->
    <div class="card">
      <div class="card-title">
        <span class="icon icon-mic">🎙️</span>
        录音模块
      </div>
      <div class="btn-group">
        <button class="btn btn-blue" onclick="checkRecordAudioPermission()">查看权限</button>
        <button class="btn btn-green" onclick="requestRecordAudioPermission()">申请权限</button>
        <button class="btn btn-red" onclick="startRecordAudio()">开始录音</button>
        <button class="btn btn-gray" onclick="stopRecordAudio()">停止</button>
        <button class="btn btn-orange" onclick="cancelRecordAudio()">取消</button>
        <button class="btn btn-purple" onclick="restartRecordAudio()">重录</button>
      </div>
      <div class="result-box" id="recordAudioRes"></div>
    </div>

    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script>
      var vConsole = new window.VConsole();
    </script>

    <script src="./h5pack-bridge.min.js"></script>

    <script>
      // ========== 工具函数 ==========
      function showResult(id, text) {
        document.getElementById(id).textContent = text;
      }

      // ========== 相机模块 ==========
      function checkCameraPermission() {
        h5packBridge.camera.checkPermission().then(res => {
          console.log('相机权限', res);
          alert('相机权限：' + (res ? '已授权' : '未授权'));
        });
      }

      function requestCameraPermission() {
        h5packBridge.camera.requestPermission().then(res => {
          console.log('申请相机权限', res);
          alert('申请结果：' + JSON.stringify(res));
        });
      }

      function openCamera() {
        h5packBridge.camera.open().then(res => {
          console.log('拍照res', res);
          document.getElementById('cameraPreview').src = res?.base64;
        });
      }

      function chooseImage() {
        h5packBridge.camera.chooseImage().then(res => {
          console.log('相册res', res);
          document.getElementById('cameraPreview').src = res[0]?.base64;
        });
      }

      function scan() {
        h5packBridge.camera.scan().then(res => {
          showResult('scanRes', '扫码结果：' + res);
        });
      }

      // ========== 位置模块 ==========
      function checkLocationPermission() {
        h5packBridge.location.checkPermission().then(granted => {
          console.log('定位权限', granted);
          alert('定位权限：' + (granted ? '已授权' : '未授权'));
        });
      }

      function requestLocationPermission() {
        h5packBridge.location.requestPermission().then(res => {
          console.log('申请定位权限', res);
          alert('结果：' + JSON.stringify(res));
        });
      }

      function checkLocationEnabled() {
        h5packBridge.location.checkLocationEnabled().then(enabled => {
          console.log('定位服务', enabled);
          alert('定位服务：' + (enabled ? '已开启' : '未开启'));
        });
      }

      function getCurrentPosition() {
        showResult('position', '定位中...');
        h5packBridge.location
          .getCurrentPosition()
          .then(res => {
            console.log('地址res', res);
            var lat = res.coords.latitude;
            var lng = res.coords.longitude;
            var acc = res.coords.accuracy;
            showResult('position', '纬度：' + lat + '\n经度：' + lng + '\n精度：' + acc + 'm');
          })
          .catch(err => {
            console.error('定位失败', err);
            showResult('position', '错误：' + err.code + '\n' + err.message);
            if (err.code === 'LOCATION_PERMISSION_NEVER_ASK_AGAIN') {
              if (confirm('定位权限被永久拒绝，是否打开应用设置页？')) {
                h5packBridge.location.openAppSettings();
              }
            } else if (err.code === 'LOCATION_SERVICES_DISABLED') {
              if (confirm('定位服务未开启，是否打开定位设置？')) {
                h5packBridge.location.openLocationSettings();
              }
            }
          });
      }

      function openLocationSettings() {
        h5packBridge.location.openLocationSettings();
      }

      function openAppSettings() {
        h5packBridge.location.openAppSettings();
      }

      // ========== 录音模块 ==========
      function checkRecordAudioPermission() {
        h5packBridge.recordAudio.checkPermission().then(res => {
          console.log('录音权限', res);
          alert('录音权限：' + (res ? '已授权' : '未授权'));
        });
      }

      function requestRecordAudioPermission() {
        h5packBridge.recordAudio.requestPermission().then(res => {
          console.log('申请录音权限', res);
        });
      }

      function startRecordAudio() {
        h5packBridge.recordAudio.start().then(res => {
          console.log('开始录音', res);
          showResult('recordAudioRes', '录音中... 路径：' + res);
        });
      }

      function stopRecordAudio() {
        h5packBridge.recordAudio.stop().then(res => {
          console.log('停止录音', res);
          showResult('recordAudioRes', '录音完成：' + JSON.stringify(res));
        });
      }

      function cancelRecordAudio() {
        h5packBridge.recordAudio.cancel().then(() => {
          showResult('recordAudioRes', '录音已取消');
        });
      }

      function restartRecordAudio() {
        h5packBridge.recordAudio.restart().then(res => {
          console.log('重新录音', res);
          showResult('recordAudioRes', '重新录音中... 路径：' + res);
        });
      }
    </script>
  </body>
</html>
